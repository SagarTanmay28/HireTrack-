name: Deploy HireTrack

on:
  push:
    branches: [main]   # Runs every time you push to main branch

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Backend to Render
        # Render gives you a deploy hook URL in your service settings.
        # Store it as RENDER_DEPLOY_HOOK in GitHub Secrets.
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install & Build
        working-directory: ./frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}  # Your Render backend URL

      # Vercel auto-deploys when it detects a push to main.
      # You just need to connect your GitHub repo in Vercel dashboard.
      # The build output (dist/) will be auto-detected.
