server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # This is the KEY config for React Router.
    # Without it, refreshing /dashboard returns 404 because
    # nginx looks for a real file at that path.
    # This tells nginx: always serve index.html, let React handle routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
